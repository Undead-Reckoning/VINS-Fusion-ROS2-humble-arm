%YAML:1.0

#common parameters
#support: 1 imu 1 cam; 1 imu 2 cam: 2 cam; 
imu: 1         
num_of_cam: 1  

imu_topic: "/imu0"
image0_topic: "/cam"
output_path: "/home/myles/output_vins/"

cam0_calib: "undead_cam.yaml"
image_width: 1600
image_height: 1300
   
#GPU acceleration
use_gpu         : 0
use_gpu_acc_flow: 0
use_gpu_ceres   : 0

# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 1   # 0  Have an accurate extrinsic parameters. We will trust the following imu^R_cam, imu^T_cam, don't change it.
                        # 1  Have an initial guess about extrinsic parameters. We will optimize around your initial guess.

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [1, 0, 0, -0.08749,
          0, 1, 0, 0.01905,
          0, 0, 1, 0.01549,
          0, 0, 0, 1]
  #  data: [0, 0, -1, -0.08749,
  #         1, 0, 0, 0.01905,
  #         0, -1, 0, 0.01549,
  #         0, 0, 0, 1]

   #data: [0, 0, 1, 0.08749,
   #       -1, 0, 0, -0.01905,
   #       0, -1, 0, 0.01549,
   #       0, 0, 0, 1]
   #data: [0, 1, 0, 0.07292,
   #       0, 0, 1, -0.10056,
   #      1, 0, 0, -0.00255,
   #       0, 0, 0, 1]


#Multiple thread support
multiple_thread: 1

#feature traker paprameters
max_cnt: 150            # max feature number in feature tracking
min_dist: 20            # min distance between two features 
freq: 0                # frequence (Hz) of publish tracking result. At least 10Hz for good estimation. If set 0, the frequence will be same as raw image 
F_threshold: 1.0        # ransac threshold (pixel)
show_track: 1           # publish tracking image as topic
flow_back: 1            # perform forward and backward optical flow to improve feature tracking accuracy

#optimization parameters
max_solver_time: 0.04  # max solver itration time (ms), to guarantee real time
max_num_iterations: 8   # max solver itrations, to guarantee real time
keyframe_parallax: 10.0 # keyframe selection threshold (pixel)

#imu parameters       The more accurate parameters you provide, the better performance
#acc_n: 8.1612e-4          # accelerometer measurement noise standard deviation. 
#gyr_n: 0.0012         # gyroscope measurement noise standard deviation.   
#acc_w: 3.8205e-7        # accelerometer bias random work noise standard deviation.  
#gyr_w: 1.1811e-4       # gyroscope bias random work noise standard deviation.

# Parameters estimated by imu_calibrator.py on 2/28
# acc_n: 2.715171e-02
# gyr_n: 8.753782e-04
# acc_w: 2.715171e-04
# gyr_w: 8.753782e-06
# acc_n: 4.660322e-01
# gyr_n: 8.594604e-04
# acc_w: 4.660322e-02
# gyr_w: 8.594604e-06
g_norm: 9.7956     # gravity magnitude

#base imu parameters
acc_n: 0.1          # accelerometer measurement noise standard deviation. 
gyr_n: 0.01         # gyroscope measurement noise standard deviation.     
acc_w: 0.001        # accelerometer bias random work noise standard deviation.  
gyr_w: 0.0001       # gyroscope bias random work noise standard deviation.     
#g_norm: 9.7956     # gravity magnitude

# INTERNAL IMU
#g_norm: 9.8107     # gravity magnitude
#acc_n: 0.046          # accelerometer measurement noise standard deviation. 
#gyr_n: 0.5         # gyroscope measurement noise standard deviation.     
#acc_w: 0.07        # accelerometer bias random work noise standard deviation.  
#gyr_w: 0.008       # gyroscope bias random work noise standard deviation.     
#g_norm: 9.7956 

#unsynchronization parameters
estimate_td: 1                      # online estimate time offset between camera and imu
td: -0.003                             # initial value of time offset. unit: s. readed image clock + td = real image clock (IMU clock)

#loop closure parameters
load_previous_pose_graph: 0        # load and reuse previous pose graph; load from 'pose_graph_save_path'
pose_graph_save_path: "~/output/pose_graph/" # save and load path
save_image: 1                   # save image in pose graph for visualization prupose; you can close this function by setting 0 

# Additional Sensor Additions
baro_topic: "/synced/baro"
mag_topic: "/synced/mag"

# Added Sensor Parameters
baro_n: 0.66 # barometer measurement noise standard deviation, in meters.
mag_N: 0.0029 # magnetometer measurement noise standard deviation
